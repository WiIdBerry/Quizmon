<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" color="#ffffff" role="img" aria-labelledby="title desc">
  <title id="title">Quizmon Arenasymbol</title>
  <desc id="desc">Symmetrische Krone mit fünf abgerundeten Spitzen, ruhiger Innenfläche und einem stabilen Kronenband.</desc>

  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gefüllte Kronensilhouette ohne Hintergrundfläche -->
    <path
      d="M18 71 9.2 32.5A5.5 5.5 0 1 1 16.3 32.2L27.5 57.5 27 22A5.5 5.5 0 1 1 35 22L43 54.5 44.4 14.3A5.6 5.6 0 1 1 51.6 14.3L53 54.5 61 22A5.5 5.5 0 1 1 69 22L68.5 57.5 79.7 32.2A5.5 5.5 0 1 1 86.8 32.5L78 71Z"
      fill="currentColor"
      fill-opacity=".18"
      stroke="none"
    />

    <!-- Durchgehende Außenkontur; die Unterkante übernimmt das Kronenband -->
    <path
      d="M18 71 9.2 32.5A5.5 5.5 0 1 1 16.3 32.2L27.5 57.5 27 22A5.5 5.5 0 1 1 35 22L43 54.5 44.4 14.3A5.6 5.6 0 1 1 51.6 14.3L53 54.5 61 22A5.5 5.5 0 1 1 69 22L68.5 57.5 79.7 32.2A5.5 5.5 0 1 1 86.8 32.5L78 71"
      fill="none"
      stroke-width="5.5"
    />

    <!-- Breites, leicht plastisches Kronenband -->
    <path
      d="M15 69h66v11.5c0 3-2.5 5.5-5.5 5.5h-55c-3 0-5.5-2.5-5.5-5.5Z"
      fill="currentColor"
      fill-opacity=".42"
      stroke-width="5.5"
    />

    <!-- Drei klare Schmucksteine statt kleinteiliger Ornamentik -->
    <g fill="currentColor" fill-opacity=".2" stroke-width="3" opacity=".82">
      <path d="m28 77.5 4-3.8 4 3.8-4 3.8Z"/>
      <path d="m43 77.5 5-4.6 5 4.6-5 4.6Z"/>
      <path d="m60 77.5 4-3.8 4 3.8-4 3.8Z"/>
    </g>
  </g>
</svg>
